# Single source of tuning for detection and scoring
# All numbers live here - no magic numbers in code.

anomaly:
  z_cap: 4.0
  own_window: 8
  min_own_window: 4
  min_peers: 5
  min_scale:
    auth_fail_rate: 0.02
    unauth_share: 0.01
    complaints_rate: 0.05

hard_signals:
  stock_gap_pct:
    low: 2.0
    high: 6.0
  board_mismatch_pct:
    low: 5.0
    high: 12.0

weights:
  stock_gap_pct: 0.25
  board_mismatch_pct: 0.25
  unauth_share: 0.20
  complaints_rate: 0.15
  auth_fail_rate: 0.10

bands:
  high: 60.0
  medium: 30.0

vulnerability:
  uplift_factor: 0.90

explanation:
  top_k: 20

auth:
  session_hours: 8
  max_failed_logins: 5
  lockout_minutes: 15
  min_password_length: 10

cases:
  flag_min_band: medium
  overdue_days: 7
  action_taken_options:
    - no_action
    - warning_issued
    - stock_verification_ordered
    - referred_to_higher_authority
    - other

seeding:
  inspector_load: 25
